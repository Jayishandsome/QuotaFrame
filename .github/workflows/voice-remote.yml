name: Voice remote firmware

on:
  workflow_dispatch:
  push:
    branches:
      - voice-remote

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v5
      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -C firmware build 2>&1 | tee build.log
          grep -E "warning:" build.log | grep -v managed_components | head -50 || true
          idf.py -C firmware size
      - uses: actions/upload-artifact@v4
        with:
          name: voice-remote-firmware
          path: |
            firmware/build/grok_butler.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          retention-days: 14
