name: Four providers build

# Builds only what this fork changes: the Waveshare AMOLED 2.16 firmware with
# Codex, Claude, Gemini and Grok support, and the Apple Silicon Bridge app.
on:
  workflow_dispatch:
  push:
    branches:
      - four-providers

permissions:
  contents: read

concurrency:
  group: four-providers-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_PATH: firmware/targets/esp32_s3_touch_amoled_216

jobs:
  bridge-tests:
    name: Bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and test Bridge
        run: |
          python -m pip install --disable-pip-version-check ./bridge
          PYTHONPATH=bridge/src:. python -m unittest discover -s bridge/tests -v

  firmware:
    name: Firmware (Waveshare AMOLED 2.16)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@v5

      - name: Build firmware image
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' bridge/src/quotaframe_bridge/__init__.py)
          idf.py -C "$TARGET_PATH" -D PROJECT_VER="${version}-4p" build
          idf.py -C "$TARGET_PATH" merge-bin -o ws_usage_panel_full.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare-amoled-216
          path: |
            ${{ env.TARGET_PATH }}/build/ws_usage_panel.bin
            ${{ env.TARGET_PATH }}/build/ws_usage_panel_full.bin
          if-no-files-found: error
          retention-days: 30

  bridge-macos:
    name: Apple Silicon Bridge
    needs: bridge-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
      - name: Build application bundle
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check ./bridge
          ./bridge/build_app.sh --release-repository "${{ github.repository }}" --python python
      - name: Build DMG installer
        shell: bash
        run: |
          ./bridge/build_dmg.sh \
            --app "bridge/dist/QuotaFrame Bridge.app" \
            --output "bridge/dist/quotaframe-bridge-macos-arm64-four-providers.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-macos
          path: bridge/dist/quotaframe-bridge-macos-arm64-four-providers.dmg
          if-no-files-found: error
          retention-days: 30
